name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-packages:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    strategy:
      fail-fast: false
      matrix:
        package: [TDMCore, TDMLight, TDMSpots, TDMWeather, TDMPersistence]
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Packages/${{ matrix.package }}

  spotforge:
    name: swift test (spotforge)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      # The pipeline's tests read recorded fixtures, so this job needs no
      # network access to any of the four data sources.
      - name: swift test
        run: swift test --package-path Tools/spotforge

  spotforge-macos:
    name: swift build (spotforge, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # spotforge is a macOS CLI, but every other job builds it on Linux,
      # where `platforms:` is ignored and no availability is enforced. Two
      # macOS-only build failures have already reached a real Mac unseen —
      # JSONEncoder.withoutEscapingSlashes (see Packages/TDMSpots) and
      # Synchronization.Mutex. A build is enough to catch that class; the
      # tests themselves run on Linux above.
      - name: swift build
        run: swift build --package-path Tools/spotforge

  app:
    name: xcodegen + build app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project TheDecisiveMoment.xcodeproj \
            -scheme TheDecisiveMoment \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      # The Free configuration is what a free Apple ID can sign, and the only
      # way to know it stayed that way is to build it and read the binary.
      - name: Build the Free configuration and assert it links no WeatherKit
        run: Scripts/assert-no-weatherkit.sh
