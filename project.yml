name: TheDecisiveMoment
options:
  bundleIdPrefix: com.viktorwill
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# `Free` is a debug build that carries no WeatherKit entitlement, so it signs
# with a free Apple ID. `docs/SPEC-light.md`, "Sky, when there is no WeatherKit".
configs:
  Debug: debug
  Release: release
  Free: debug

packages:
  TDMCore:
    path: Packages/TDMCore
  TDMLight:
    path: Packages/TDMLight
  TDMSpots:
    path: Packages/TDMSpots
  TDMWeather:
    path: Packages/TDMWeather
  TDMPersistence:
    path: Packages/TDMPersistence
  TDMUI:
    path: Packages/TDMUI

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # Set at the project level as well as on the target: the local packages are
    # built as part of the project, and this is the level they inherit from.
    Free:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG TDM_NO_WEATHERKIT"

targets:
  TheDecisiveMoment:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Sources
      - path: App/Resources
      # Not compiled: it is what CODE_SIGN_ENTITLEMENTS points at in the Free
      # configuration, and it is worth being able to open in the navigator.
      - path: App/TheDecisiveMoment-Free.entitlements
        buildPhase: none
    dependencies:
      - package: TDMUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viktorwill.thedecisivemoment
        PRODUCT_NAME: The Decisive Moment
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Truthful because the live meter adds no capture output to the
        # session: it reads ISO, exposure duration and aperture only.
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to read the light level for the exposure advisor. No photos are taken or stored."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to show spots near you and to compute the sun's position. A coarse coordinate also goes to Apple's weather service for the cloud cover the light advice needs."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # A free Apple ID cannot be granted WeatherKit, and automatic signing
        # refuses an entitlement it cannot grant — so this configuration points
        # at an entitlements file that does not ask for one, and compiles the
        # provider out rather than making a call guaranteed to fail.
        Free:
          CODE_SIGN_ENTITLEMENTS: App/TheDecisiveMoment-Free.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG TDM_NO_WEATHERKIT"
    entitlements:
      path: App/TheDecisiveMoment.entitlements
      properties:
        com.apple.developer.weatherkit: true

schemes:
  TheDecisiveMoment:
    build:
      targets:
        TheDecisiveMoment: all
    run:
      config: Debug
    archive:
      config: Release
  "The Decisive Moment (Free)":
    build:
      targets:
        TheDecisiveMoment: all
    run:
      config: Free
    test:
      config: Free
    profile:
      config: Free
    analyze:
      config: Free
    archive:
      config: Free
