name: TheDecisiveMoment
options:
  bundleIdPrefix: com.viktorwill
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  TDMCore:
    path: Packages/TDMCore
  TDMLight:
    path: Packages/TDMLight
  TDMSpots:
    path: Packages/TDMSpots
  TDMWeather:
    path: Packages/TDMWeather
  TDMPersistence:
    path: Packages/TDMPersistence
  TDMUI:
    path: Packages/TDMUI

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TheDecisiveMoment:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Sources
    dependencies:
      - package: TDMUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viktorwill.thedecisivemoment
        PRODUCT_NAME: The Decisive Moment
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  TheDecisiveMoment:
    build:
      targets:
        TheDecisiveMoment: all
    run:
      config: Debug
    archive:
      config: Release
